[tools]
python = "3.13.18"
"pipx:zensical" = "0.1.3"
go = "1.27.4"
golangci-lint = "2.15.0"
actionlint = "1.7.12"
bun = "1.4.5"
uv = "0.13.10"
zizmor = "1.33.1"
jq = "1.8.2"
gh = "2.106.0"
git-town = "24.2.0"
cosign = "3.1.6"
syft = "1.57.2"
crane = "0.22.1"
grype = "0.122.1"
goreleaser = "2.20.3"
kubectl = "1.37.3"
kind = "0.33.0"
helm = "4.3.2"
flux2 = "2.10.1"
argocd = "3.6.3"
kyverno = "1.20.0"
opentofu = "1.13.10"
sops = "3.13.3"
buf = "1.75.0"
protoc = "36.2"
grpcurl = "1.9.4"
gitsign = "0.18.0"
slsa-verifier = "2.7.1"
osv-scanner = "2.7.1"
scorecard = "5.7.0"
gitleaks = "8.30.1"
"go:github.com/securego/gosec/v2/cmd/gosec" = "2.30.0"
"go:github.com/google/capslock/cmd/capslock" = "0.3.4"

[settings]
pipx.uvx = true
# install only what mise.lock records; run `mise lock` after changing a version
locked = true

[tasks.install]
description = "Install lint and format tools with bun"
run = "bun install --frozen-lockfile"

[tasks.serve]
description = "Serve the site with live reload"
run = "zensical serve"

[tasks.build]
description = "Build the site into ./site"
run = "zensical build --clean"

[tasks.fmt]
description = "Format Markdown, YAML and Go code"
depends = ["install"]
run = ["bunx --bun prettier --write '**/*.{md,yml,yaml}'", "gofmt -w ."]

[tasks."fmt:check"]
description = "Check formatting"
depends = ["install"]
run = "bunx --bun prettier --check '**/*.{md,yml,yaml}'"

[tasks.lint]
description = "Lint Markdown, workflows (correctness and security) and Makefile coverage"
depends = ["install", "make:check"]
# zizmor --offline: the audits that need the GitHub API run in CI (ci.yml).
run = ["bunx --bun markdownlint-cli2 '**/*.md'", "actionlint", "zizmor --offline --no-progress .github/workflows"]

[tasks."make:check"]
description = "Check that every mise task has a Makefile target"
run = """
missing=0
for task in $(mise tasks ls --no-header | awk '{print $1}'); do
  target=$(printf '%s' "$task" | tr ':' '-')
  if ! grep -q "^$target:" Makefile; then
    echo "Makefile has no target '$target' for mise task '$task'" >&2
    missing=1
  fi
done
exit $missing
"""

[tasks."go:check"]
description = "Vet, lint and race-test the Go reference project"
dir = "examples/orders"
run = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "golangci-lint run ./...",
  "go test -race -count=1 ./...",
  # the module cache must still match go.sum
  "go mod verify",
  # fail only on vulnerabilities the code really reaches
  "go tool govulncheck ./..."
]

[tasks.secrets]
description = "Scan the whole Git history for secrets"
# Known examples in the docs are listed, one by one, in .gitleaksignore.
run = "gitleaks git --redact --no-banner ."

[tasks.pre-commit]
description = "Scan staged changes for secrets (install: mise generate git-pre-commit --write --task pre-commit)"
run = "gitleaks git --pre-commit --staged --redact --no-banner ."

[tasks."github:apply"]
description = "Apply the GitHub settings and rulesets in .github/rulesets (needs repo admin)"
run = "bash scripts/github-settings.sh apply"

[tasks."github:check"]
description = "Compare the GitHub settings with this repository and fail on drift (read-only)"
run = "bash scripts/github-settings.sh check"

[tasks.check]
description = "Run all checks (CI entry point)"
depends = ["fmt:check", "lint", "build", "go:check", "secrets"]

[tasks.pr]
description = "Run all checks, then ./commit.sh if it is present and executable"
depends = ["check"]
# commit.sh signs commits: it needs the terminal for key touches and editors.
raw = true
run = """
if [ -x ./commit.sh ]; then
  ./commit.sh
else
  echo "pr: checks passed; no executable ./commit.sh to run"
fi
"""

[tasks.clean]
description = "Remove build output"
run = "rm -rf site .cache node_modules"
