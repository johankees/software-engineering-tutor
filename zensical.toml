[project]
site_name = "Software Engineering Tutor"
site_description = "From registers to enterprise Go: software engineering explained in plain English."
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Fundamentals" = [
    "fundamentals/index.md",
  ] },
  { "Go" = [
    "go/index.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
