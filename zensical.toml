[project]
site_name = "Software Engineering Tutor"
site_description = "From registers to enterprise Go: software engineering explained in plain English."
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Fundamentals" = [
    "fundamentals/index.md",
    "fundamentals/bits-and-bytes.md",
    "fundamentals/encodings.md",
    "fundamentals/cpu-and-registers.md",
    "fundamentals/compilers-and-bytecode.md",
    "fundamentals/memory.md",
    "fundamentals/processes-and-threads.md",
  ] },
  { "Toolbox" = [
    "toolbox/index.md",
    "toolbox/terminal-and-shell.md",
    "toolbox/tmux.md",
    "toolbox/neovim.md",
    "toolbox/mise.md",
    "toolbox/dotfiles.md",
  ] },
  { "Git" = [
    "git/index.md",
    "git/objects.md",
    "git/refs.md",
    "git/index-and-trees.md",
    "git/storage.md",
    "git/merging.md",
    "git/remotes.md",
    "git/recovery-and-history.md",
    "git/config-hooks-signing.md",
  ] },
  { "Go" = [
    "go/index.md",
    "go/toolchain.md",
    "go/modules.md",
    "go/project-layout.md",
    "go/tooling-and-quality.md",
    "go/basics.md",
    "go/types-and-data.md",
    "go/conventions.md",
    "go/methods-and-interfaces.md",
    "go/errors.md",
    "go/generics.md",
    "go/testing.md",
    "go/stdlib-essentials.md",
    "go/concurrency.md",
    "go/context.md",
    "go/performance.md",
    "go/cli.md",
    "go/services.md",
  ] },
  { "Linux" = [
    "linux/index.md",
    "linux/system-calls.md",
    "linux/file-descriptors.md",
    "linux/filesystems.md",
    "linux/signals-and-processes.md",
    "linux/namespaces-and-cgroups.md",
    "linux/systemd.md",
    "linux/debugging.md",
  ] },
  { "Networking" = [
    "networking/index.md",
  ] },
  { "Containers" = [
    "containers/index.md",
  ] },
  { "Kubernetes" = [
    "kubernetes/index.md",
  ] },
  { "Databases" = [
    "databases/index.md",
  ] },
  { "Distributed systems" = [
    "distributed-systems/index.md",
  ] },
  { "Observability" = [
    "observability/index.md",
  ] },
  { "CI/CD and delivery" = [
    "delivery/index.md",
  ] },
  { "Security" = [
    "security/index.md",
  ] },
  { "Architecture" = [
    "architecture/index.md",
  ] },
  { "Algorithms" = [
    "algorithms/index.md",
  ] },
  { "AI engineering" = [
    "ai-engineering/index.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
