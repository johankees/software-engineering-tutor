config:
  MD013: false
  # Go code blocks use tabs (gofmt); prose must not.
  MD010:
    code_blocks: false
  # Admonition bodies (!!! note) are indented, which markdownlint misreads as indented code blocks.
  MD046: false
  # md_in_html grids (<div markdown>) lay out the home page.
  MD033:
    allowed_elements: [div]
ignores:
  - site/**
  - node_modules/**
